name: Release

env:
  NODE_VERSION: 24.14.0

permissions:
  pull-requests: write
  contents: write

on:
  pull_request:
  push:
    branches:
      - "master"
      - "main"
      - "alpha"
      - "beta"

jobs:
  prerelease:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    runs-on: ubuntu-latest
    outputs:
      next_version: "${{ steps.next_version.outputs.next_version }}"
    steps:
      - name: Install dependencies
        if: github.event_name == 'push'
        run: |
          apt-get update
          apt-get install -y git-lfs jq

      - name: Checkout project
        if: github.event_name == 'push'
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci

      - name: Calculate next version
        if: github.event_name == 'push'
        id: next_version
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEA_URL: https://gogs.shadoware.org
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx semantic-release --dry-run | tee semantic_release_output.txt
          NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-.]+)?' semantic_release_output.txt)
          echo "Next detected version: \"$NEXT_VERSION\""
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  unittest:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    runs-on: ubuntu-latest
    container:
      image: node:${{ env.NODE_VERSION }}-trixie
    services:
      redis:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y protobuf-compiler cmake make build-essential git-lfs libacl1-dev libfuse-dev pkg-config zstd

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Unit test (release)
        run: cargo test --workspace -- --nocapture
        env:
          RUST_LOG: debug
          REDIS_HOST: redis

      - name: Install Node.JS dependencies
        run: |
          npm ci

      - name: Build server (rust)
        run: cargo build -p woodstock-server-rs

      - name: Build front
        run: |
          cd front
          npm run lint
          npm run build
          cd ..

      - name: Upload frontend dist as artifact
        uses: christopherhx/gitea-upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/

  dtrack:
    needs: [prerelease]
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(fromJson('["master", "main",
      "alpha", "beta", "develop"]'), github.ref_name)
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git-lfs wget apt-transport-https gnupg lsb-release
          wget -qO /usr/share/keyrings/trivy.asc https://aquasecurity.github.io/trivy-repo/deb/public.key
          echo deb [signed-by=/usr/share/keyrings/trivy.asc] https://get.trivy.dev/deb generic main | tee -a /etc/apt/sources.list.d/trivy.list
          apt-get update
          apt-get install trivy

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs --format cyclonedx --output dependency-results-raw.cdx.json .

      - name: Downgrade CycloneDX spec version for DependencyTrack compatibility
        run: |
          # Trivy emits CycloneDX 1.7, which our Dependency-Track instance
          # (5.0.4) does not parse yet ("Unrecognized specVersion 1.7").
          # Trivy has no flag to pick the spec version, so downgrade the BOM
          # with cyclonedx-cli instead. 1.7 support landed in DT 5.1
          # (https://github.com/DependencyTrack/dependency-track/issues/5818)
          # — drop this step once the server is upgraded past that.
          curl -sSL -o cyclonedx-cli https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64
          chmod +x cyclonedx-cli
          ./cyclonedx-cli convert --input-file dependency-results-raw.cdx.json --output-file dependency-results.cdx.json --input-format json --output-format json --output-version v1_6

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >>
          $GITHUB_OUTPUT
        id: extract_branch

      - name: Upload to DependencyTrack
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: "dtrack-api.shadoware.org"
          apiKey: ${{ secrets.DTRACK_APIKEY }}
          projectName: "Woodstock backup"
          projectVersion: ${{ steps.extract_branch.outputs.branch }}
          projectTags: "woodstock-${{ needs.prerelease.outputs.next_version || '' }}"
          bomFilename: "dependency-results.cdx.json"
          autoCreate: true

  clientrs:
    needs: [prerelease]
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --features default
            binary_name: binaries-linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --no-default-features --features "mdns"
            binary_name: binaries-linux-lite
          - os: freebsd-latest
            target: x86_64-unknown-freebsd
            features: --no-default-features --features "mdns,xattr"
            binary_name: binaries-freebsd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: --features default
            binary_name: binaries-windows
        # Disabled musl target for (depending of libm, libc,...)
        # - os: ubuntu-latest
        #   target: x86_64-unknown-linux-musl
        # need dependencies: # musl-dev musl-tools

    steps:
      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y protobuf-compiler cmake make build-essential git-lfs libacl1-dev libfuse-dev zip curl xz-utils

      # - name: Install build dependencies (FreeBSD)
      #   if: matrix.os == 'freebsd-latest'
      #   run: |
      #     pkg update
      #     pkg install -y protobuf cmake gmake pkgconf zip git-lfs fusefs-libs curl

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true

      - name: Mise à jour des versions
        if: github.event_name == 'push'
        run: |
          cargo install cargo-workspaces
          cargo workspaces version --no-git-commit -y custom ${{ needs.prerelease.outputs.next_version }}

      - name: Build (release)
        env:
          # Forces the msvc target's crt-static feature, guaranteeing it wins
          # over any ambient RUSTFLAGS on the runner. In practice this does
          # NOT fully eliminate the dynamic CRT dependency (see the check
          # below): ws_client_daemon.exe still pulls in VCRUNTIME140.dll and
          # several api-ms-win-crt-* apisets, most likely via VSSAPI.LIB from
          # the Windows SDK, which cannot be recompiled statically. Left in
          # place as a correct, harmless forcing of the flag; the Visual C++
          # Redistributable is documented as a real prerequisite instead
          # (docs/website/doc/agent.md).
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --verbose --release --target ${{ matrix.target }} ${{
          matrix.features }}

      - name: Check CRT linking (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $exe = "target/${{ matrix.target }}/release/ws_client_daemon.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found via vswhere; skipping CRT dependency check for $exe"
            exit 0
          }
          $deps = & $dumpbin /dependents $exe
          $bad = $deps | Select-String -Pattern "VCRUNTIME|api-ms-win-crt-"
          if ($bad) {
            # Known, documented dependency (see agent.md Prerequisites) rather
            # than a hard gate: it has never been clean on this codebase, so
            # failing the job here would only make the release pipeline
            # permanently red. Informational only.
            Write-Warning "$exe depends on the dynamic CRT ($(($bad | ForEach-Object { $_.Line.Trim() }) -join ', ')). The Visual C++ Redistributable 2015-2022 (x64) is required on the target machine."
          } else {
            Write-Host "OK: $exe has no dynamic CRT dependency"
          }

      - name: Archive binaries
        run: |
          mkdir zipfile

          cd target/${{ matrix.target }}/release

          cp ws_client_daemon* ../../../zipfile
          cp ws_client_console* ../../../zipfile
          cp ws_console* ../../../zipfile
          cp ws_restore* ../../../zipfile
          cp ws_sync* ../../../zipfile
          cp ws_backuppc_importer* ../../../zipfile

          cp api_server* ../../../zipfile
          cp client_api_server* ../../../zipfile
          cp job_worker* ../../../zipfile
          cp scheduler* ../../../zipfile

      - name: Archive binary (Linux/FreeBSD)
        shell: bash
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'freebsd-latest'
        run: |
          cd zipfile
          find . -type f \( -name "*.d" -o -name "*.pdb" \) -delete
          zip -r "${{ matrix.binary_name }}-${{ matrix.target }}.zip" *

      - name: Archive binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd zipfile
          powershell -Command "Get-ChildItem -Path * -Exclude *.d,*.pdb | Compress-Archive -DestinationPath ${{ matrix.binary_name }}-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: christopherhx/gitea-upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: |
            zipfile/${{ matrix.binary_name }}-${{ matrix.target }}.zip

  upload:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    needs: [clientrs, unittest]
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git-lfs jq

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Installation de cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Install dependencies
        run: npm ci

      - name:
          Verify the integrity of provenance attestations and registry signatures
          for installed dependencies
        run: npm audit signatures

      - name: Download artifacts
        uses: christopherhx/gitea-download-artifact@v8
        with:
          path: artifacts/

      - name: Import GPG key
        if: github.event_name == 'push'
        id: import-gpg
        uses: https://github.com/crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: 0C69E9FC3A34B91A
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: GPG user IDs
        if: github.event_name == 'push'
        run: |
          echo "fingerprint: ${{ steps.import-gpg.outputs.fingerprint }}"
          echo "keyid:       ${{ steps.import-gpg.outputs.keyid }}"
          echo "name:        ${{ steps.import-gpg.outputs.name }}"
          echo "email:       ${{ steps.import-gpg.outputs.email }}"

      - name: Display structure of downloaded files
        if: github.event_name == 'push'
        run: |
          mkdir zipfile
          for dir in artifacts/*/; do
            [ "$(basename "$dir")" = "front-dist" ] && continue
            mv "$dir"* ./zipfile/
          done
          cd ./zipfile
          shasum --algorithm 256 --binary ./* | tee ./SHA256SUM.txt
          cat ./SHA256SUM.txt
          for file in *; do
            gpg --batch --yes --armor --detach-sign "$file"
          done

      - name: Release
        if: github.event_name == 'push'
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEA_URL: https://gogs.shadoware.org
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import-gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import-gpg.outputs.email }}
        run: npx semantic-release

  debian_rs:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    needs: [upload, prerelease, clientrs]
    runs-on: ubuntu-latest
    # Build the .deb on the distribution it targets: the resulting packages
    # declare a libc6 dependency matching the build host, and they are published
    # to the `trixie` pool. A bare debian:trixie image would not work — the
    # runner needs Node to execute the actions, hence the node:* variant.
    container:
      image: node:${{ env.NODE_VERSION }}-trixie
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git-lfs pkg-config unzip

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Node.JS dependencies
        run: npm ci

      - name: Download frontend dist artifact
        uses: christopherhx/gitea-download-artifact@v8
        with:
          name: front-dist
          path: server-rs/front-dist/

      # Reuses the release binaries already built by clientrs (binaries-linux,
      # --features default target x86_64-unknown-linux-gnu) instead of letting
      # `cargo deb` recompile the whole workspace a second time — same pattern
      # already used by the freebsd_pkg job.
      - name: Download Linux binaries artifact
        uses: christopherhx/gitea-download-artifact@v8
        with:
          name: binaries-linux
          path: artifacts/binaries-linux/

      - name: Place prebuilt binaries for cargo-deb --no-build
        run: |
          mkdir -p target/${{ matrix.target }}/release
          INNER_ZIP=$(find artifacts/binaries-linux -name "*.zip" | head -1)
          unzip -o "${INNER_ZIP}" -d target/${{ matrix.target }}/release
          chmod +x target/${{ matrix.target }}/release/*

      - name: Installation de cargo-deb
        run: cargo install cargo-deb

      - name: Mise à jour des versions
        if: github.event_name == 'push'
        run: |
          cargo install cargo-workspaces
          cargo workspaces version --no-git-commit -y custom ${{ needs.prerelease.outputs.next_version }}

      - name: Generate debian package
        run: |
          cargo deb --no-build -p woodstock-client-rs --target ${{ matrix.target }}
          cargo deb --no-build -p woodstock-cli-rs --target ${{ matrix.target }}
          cargo deb --no-build -p ws_backuppc_importer --target ${{ matrix.target }}
          cargo deb --no-build -p woodstock-server-rs --target ${{ matrix.target }}

      - name: Upload Debian packages as artifact
        uses: christopherhx/gitea-upload-artifact@v7
        with:
          name: debian-packages
          path: target/${{ matrix.target }}/debian/*.deb

      - name: Publish package to debian gitea repository
        if: github.event_name == 'push'
        run: |
          for file in target/${{ matrix.target }}/debian/*.deb; do
            curl --user "phoenix:${{ secrets.RELEASE_TOKEN }}" \
              --upload-file $file \
              https://gogs.shadoware.org/api/packages/ShadowareOrg/debian/pool/trixie/main/upload
          done

  freebsd_pkg:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    needs: [upload, prerelease]
    runs-on: freebsd-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true
          ref: ${{ github.ref }}

      - name: Get artifact IDs
        id: get-artifact-ids
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ARTIFACTS=$(curl -fsSL \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "https://gogs.shadoware.org/api/v1/repos/ShadowareOrg/woodstock-backup/actions/runs/${RUN_ID}/artifacts")
          FREEBSD_ID=$(echo "${ARTIFACTS}" | \
            jq -r '[.artifacts[] | select(.name=="binaries-freebsd")] | max_by(.id) | .id')
          FRONTDIST_ID=$(echo "${ARTIFACTS}" | \
            jq -r '[.artifacts[] | select(.name=="front-dist")] | max_by(.id) | .id')

          echo "ids=${FREEBSD_ID},${FRONTDIST_ID}" >> $GITHUB_OUTPUT

      - name: Download FreeBSD binaries and frontend
        uses: christopherhx/gitea-download-artifact@v8
        with:
          artifact-ids: ${{ steps.get-artifact-ids.outputs.ids }}
          path: artifacts/

      - name: Extract FreeBSD binaries
        run: |
          mkdir -p zipfile
          INNER_ZIP=$(find artifacts/binaries-freebsd -name "*.zip" | head -1)
          unzip -o "${INNER_ZIP}" -d zipfile
          find zipfile -type f \( -name "*.d" -o -name "*.pdb" \) -delete
          mv artifacts/front-dist front/dist

      - name: Build FreeBSD packages
        env:
          VERSION: ${{ needs.prerelease.outputs.next_version }}
        run: |
          PKG_VERSION="${VERSION}"
          if [ -z "${PKG_VERSION}" ]; then
            PKG_VERSION=$(grep '^version' server-rs/Cargo.toml | head -1 | grep -oE '[0-9]+[.][0-9]+[.][0-9]+.*' | tr -d '"')
          fi
          PKG_VERSION="${PKG_VERSION:-0.0.0}"
          mkdir -p pkg-out
          sh scripts/create-freebsd-pkg.sh \
            "${PKG_VERSION}" \
            zipfile \
            pkg-out \
            front/dist

      - name: Upload FreeBSD packages as artifact
        uses: christopherhx/gitea-upload-artifact@v7
        with:
          name: freebsd-packages
          path: pkg-out/*.pkg

      - name: Publish packages to Gitea generic registry
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.prerelease.outputs.next_version }}
        run: |
          PKG_VERSION="${VERSION:-0.0.0-dev}"
          for file in pkg-out/*.pkg; do
            filename="$(basename "${file}")"
            curl --fail \
              --user "phoenix:${{ secrets.RELEASE_TOKEN }}" \
              --upload-file "${file}" \
              "https://gogs.shadoware.org/api/packages/ShadowareOrg/generic/woodstock-freebsd/${PKG_VERSION}/${filename}"
          done

  docker:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    needs: [upload]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust_version: 1
            cargo_args: --workspace --bins --features default
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git-lfs unzip

      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true
          ref: ${{ github.ref }}

      - name: Download Linux binaries artifact
        uses: christopherhx/gitea-download-artifact@v8
        with:
          name: binaries-linux
          path: artifacts/binaries-linux/

      - name: Download frontend dist artifact
        uses: christopherhx/gitea-download-artifact@v8
        with:
          name: front-dist
          path: artifacts/front-dist/

      - name: Prepare Docker build contexts from prebuilt artifacts
        run: |
          # Reuses the release binaries already built by clientrs (binaries-linux)
          # and the frontend already built by unittest, instead of letting the
          # Dockerfile recompile everything from source in the `binaries`/`frontend`
          # stages (see Dockerfile: these stages default to compiling from source
          # for a plain local `docker build .`, and are only overridden here via
          # buildx additional build contexts).
          mkdir -p ci-context-binaries/src/target/release
          INNER_ZIP=$(find artifacts/binaries-linux -name "*.zip" | head -1)
          unzip -o "${INNER_ZIP}" -d ci-context-binaries/src/target/release
          chmod +x ci-context-binaries/src/target/release/*

          mkdir -p ci-context-frontend/src/front/dist
          cp -r artifacts/front-dist/. ci-context-frontend/src/front/dist/

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >>
          $GITHUB_OUTPUT

      - name: Get metadata to tag server container image
        if: github.event_name == 'push'
        uses: https://github.com/docker/metadata-action@v4
        id: meta
        with:
          context: git
          # Liste des images Docker à utiliser comme base pour les tags
          images: |
            phoenix741/woodstock-backup
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Get metadata to tag client container image
        if: github.event_name == 'push'
        uses: https://github.com/docker/metadata-action@v4
        id: meta-client
        with:
          context: git
          # Liste des images Docker à utiliser comme base pour les tags
          images: |
            phoenix741/woodstock-backup-client
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Get metadata to tag website container image
        if: github.event_name == 'push'
        uses: https://github.com/docker/metadata-action@v4
        id: meta-website
        with:
          context: git
          # Liste des images Docker à utiliser comme base pour les tags
          images: |
            phoenix741/woodstock-backup-website
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Setup docker
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v2
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build Server Docker Image
        uses: docker/build-push-action@v6
        env:
          ACTIONS_RUNTIME_TOKEN: ""
        with:
          file: Dockerfile
          context: .
          load: true
          target: server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            binaries=./ci-context-binaries
            frontend=./ci-context-frontend
          build-args: |
            RUST_VERSION=${{matrix.rust_version}}
            NODE_VERSION=${{ env.NODE_VERSION }}-slim
            DEBIAN_VERSION=trixie
            CARGO_ARGS=${{matrix.cargo_args}}

      - name: Build Client Docker Image
        uses: docker/build-push-action@v6
        env:
