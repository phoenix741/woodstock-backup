name: Website

env:
  NODE_VERSION: 24.14.0

permissions:
  contents: read

on:
  push:
    branches:
      - "master"
      - "main"
      - "alpha"
      - "beta"
    paths:
      - "docs/website/**"
      - ".gitea/workflows/website.yml"

jobs:
  docker:
    env:
      RUNNER_TOOL_CACHE: /toolcache # Runner Tool Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Get metadata to tag website container image
        uses: https://github.com/docker/metadata-action@v4
        id: meta-website
        with:
          context: git
          images: |
            phoenix741/woodstock-backup-website
          tags: |
            type=ref,event=branch

      - name: Setup docker
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Website Docker Image
        uses: docker/build-push-action@v6
        env:
          ACTIONS_RUNTIME_TOKEN: ""
        with:
          file: ./docs/website/Dockerfile
          context: ./docs/website
          push: true
          tags: ${{ steps.meta-website.outputs.tags }}
          labels: ${{ steps.meta-website.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
