[package]
name = "woodstock-cli-rs"
description = "Woodstock Tools"
version = "2.1.0-alpha.8"
edition = "2021"
authors = ["Ulrich Vandenhekke <ulrich.vdh@gmail.com>"]
license = "MIT"

[package.metadata.deb]
# Renamed from `woodstock-cli-rs` in 2.0.1 for consistency with
# `woodstock-server` / `woodstock-client`; see client-rs/Cargo.toml.
name = "woodstock-cli"
provides = "woodstock-cli-rs"
replaces = "woodstock-cli-rs"
conflicts = "woodstock-cli-rs"
license-file = ["../LICENSE", "0"]

[features]
default = ["fuse_unix"]
fuse_unix = ["dep:lru", "dep:twox-hash", "dep:libc", "dep:fuser", "dep:rand"]

[[bin]]
name = "ws_console"
path = "src/console.rs"

[[bin]]
name = "ws_sync"
path = "src/wssync.rs"

[[bin]]
name = "ws_restore"
path = "src/wsrestore.rs"

[dependencies]
async-stream = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
console = { workspace = true }
eyre = { workspace = true }
async-compression = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
# acl/xattr: `ws_console archive` (dir-mode, archiving::fs_materialize)
# restores these best-effort via woodstock-rs::utils::restore_metadata.
woodstock-rs = { workspace = true, features = ["acl", "xattr"] }
chrono.workspace = true
redis = { workspace = true }
uuid = { workspace = true }

# Fuse dependencies
[target.'cfg(unix)'.dependencies]
lru = { workspace = true, optional = true }
twox-hash = { version = "^2.1", optional = true }
libc = { version = "^0.2", optional = true }
fuser = { version = "0.18", optional = true }
rand = { workspace = true, optional = true }
