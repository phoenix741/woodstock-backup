[package]
name = "woodstock-cli-rs"
description = "Woodstock Tools"
version = "2.0.0-alpha.48"
edition = "2021"
authors = ["Ulrich Vandenhekke"]
license = "MIT"

[package.metadata.deb]
license-file = ["../LICENSE", "0"]

[features]
default = ["fuse_unix"]
fuse_unix = ["dep:lru", "dep:twox-hash", "dep:libc", "dep:fuser", "dep:rand"]

[[bin]]
name = "ws_console"
path = "src/console.rs"

[[bin]]
name = "ws_sync"
path = "src/wssync.rs"

[[bin]]
name = "ws_restore"
path = "src/wsrestore.rs"

[dependencies]
async-stream = "^0.3"
clap = { version = "^4.5", features = ["derive"] }
color-eyre = "^0.6"
console = "^0.15"
env_logger = "^0.11"
eyre = "^0.6"
async-compression = { version = "^0.4", features = ["tokio", "zstd", "zlib"] }
futures = "^0.3"
hex = { version = "^0.4", features = ["serde"] }
indicatif = "^0.17"
log = { version = "^0.4", default-features = false, features = [
  "std",
  "max_level_debug",
  "release_max_level_info",
] }
multi_log = "^0.1"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1.40", features = ["fs", "macros", "rt-multi-thread"] }
tokio-util = "^0.7"
tonic = { version = "^0.13", features = ["tls-native-roots", "gzip"] }
woodstock-rs = { path = "../woodstock-rs", default-features = false }

# Fuse dependencies
[target.'cfg(unix)'.dependencies]
lru = { version = "^0.14", optional = true }
twox-hash = { version = "^2.1", optional = true }
libc = { version = "^0.2", optional = true }
fuser = { version = "0.15", optional = true }
rand = { version = "^0.9", optional = true }
