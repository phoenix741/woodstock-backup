services:
  website:
    build:
      context: ./docs/website
      dockerfile: Dockerfile
    image: phoenix741/woodstock-backup-website:develop
    ports:
      - 8080:80
  # Main API Server & Frontend
  server-api:
    build:
      context: ./
      dockerfile: Dockerfile
      target: server
    image: phoenix741/woodstock-backup:develop
    ports:
      - 3000:3000
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - LOG_LEVEL=debug
      - BACKUP_PATH=/backups
      - STATIC_PATH=/app/static
    volumes:
      - "backups_storage:/backups"

  # gRPC/HTTPS Gateway for Agents
  server-client-api:
    image: phoenix741/woodstock-backup:develop
    command: ["/app/client_api_server"]
    ports:
      - 8443:8443
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - LOG_LEVEL=info
      - BACKUP_PATH=/backups
    volumes:
      - "backups_storage:/backups"

  # Backup Worker ( Heavy operations)
  server-worker:
    image: phoenix741/woodstock-backup:develop
    command: ["/app/job_worker"]
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - LOG_LEVEL=info
      - BACKUP_PATH=/backups
    volumes:
      - "backups_storage:/backups"

  # Scheduler (Cron jobs)
  server-scheduler:
    image: phoenix741/woodstock-backup:develop
    command: ["/app/scheduler"]
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - LOG_LEVEL=info
      - BACKUP_PATH=/backups
    volumes:
      - "backups_storage:/backups"

  woodstock_client:
    build:
      context: ./
      dockerfile: Dockerfile
      target: client
    image: phoenix741/woodstock-backup-client:develop
    ports:
      - 3657:3657
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - WS_CLIENT_CONFIG=/etc/woodstock
      - WS_CLIENT_PASSWORD=password
      - WS_CLIENT_SERVER=https://server-client-api:8443
      - LOG_LEVEL=debug
    volumes:
      - "client_storage:/etc/woodstock"

  # woodstock_client:
  #   image: phoenix741/woodstock-backup:develop
  #   command: /nestjs/apps/client/main.js
  #   environment:
  #     - LOG_LEVEL=debug
  #     - NODE_ENV=development

  valkey:
    image: "valkey/valkey:9-alpine"
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - "valkey_data:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus_storage:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: "host"

volumes:
  valkey_data:
  prometheus_storage:
  client_storage:
  backups_storage:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/woodstock
      o: bind
