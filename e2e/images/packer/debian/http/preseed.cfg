# Unattended Debian trixie install for the Woodstock e2e golden image.
#
# Rendered by Packer's templatefile() (see debian.pkr.hcl, http_content) and
# served over Packer's built-in HTTP server. Deliberately minimal: the golden
# image is a bare system with SSH, everything Woodstock-specific happens in
# provision/.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

# Take the first interface that comes up (NIC0, user-mode, has DHCP).
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string woodstock-e2e
d-i netcfg/get_domain string lab
d-i netcfg/hostname string woodstock-e2e

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# Root login over SSH by key; no unprivileged user is needed, the whole suite
# runs as root (the Woodstock client itself runs as root by design).
d-i passwd/root-login boolean true
d-i passwd/root-password password woodstock
d-i passwd/root-password-again password woodstock
d-i passwd/make-user boolean false

# Whole first disk, single ext4 partition, no swap: the VM is disposable and
# a separate /home would get in the way of mounting the btrfs data disk there.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/expert_recipe string                         \
      atomic ::                                               \
              1000 50 -1 ext4                                 \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true

tasksel tasksel/first multiselect standard, ssh-server
# btrfs-progs: the agent shells out to `btrfs subvolume snapshot`.
# acl / attr:  needed to set and verify ACLs and xattrs on the test data.
d-i pkgsel/include string openssh-server sudo curl ca-certificates btrfs-progs acl attr rsync unzip jq
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

d-i finish-install/reboot_in_progress note

# Install the harness SSH key and make the console usable for debugging.
#
# The pubkey is substituted directly by templatefile() at Packer-parse time,
# not fetched over HTTP: HTTPPort is only allocated once the build boots, so a
# static preseed file cannot reference it, and there is no reason to round-trip
# through the installer's network stack for a value already known on the host.
d-i preseed/late_command string \
    in-target mkdir -p /root/.ssh; \
    in-target sh -c "echo '${ssh_pubkey}' > /root/.ssh/authorized_keys"; \
    in-target chmod 700 /root/.ssh; \
    in-target chmod 600 /root/.ssh/authorized_keys; \
    in-target sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 console=ttyS0,115200n8"/' /etc/default/grub; \
    in-target sh -c "echo GRUB_TERMINAL=serial >> /etc/default/grub"; \
    in-target update-grub; \
    in-target systemctl enable ssh
