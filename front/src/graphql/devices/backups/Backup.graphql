query Backup($hostname: String!, $number: Int!) {
  backup(hostname: $hostname, number: $number) {
    id

    number
    completed

    startDate
    endDate

    errorCount

    fileCount
    newFileCount
    existingFileCount
    removedFileCount
    modifiedFileCount

    fileSize
    newFileSize
    existingFileSize

    speed
  }
}
