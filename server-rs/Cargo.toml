[package]
name = "woodstock-server-rs"
description = "Woodstock Backup Server Components"
version = "2.1.0-alpha.9"
edition = "2021"
authors = ["Ulrich Vandenhekke <ulrich.vdh@gmail.com>"]
license = "MIT"

[package.metadata.deb]
name = "woodstock-server"
license-file = ["../LICENSE", "0"]
maintainer-scripts = "debian/"
# `valkey` is a source package only; the binary package is `valkey-server`.
# With the old name the alternative always fell through to redis-server.
depends = "$auto, valkey-server | redis-server, ca-certificates"
conf-files = ["/etc/woodstock/server.env"]
systemd-units = [
  { unit-name = "woodstock-api", enable = true, start = true },
  { unit-name = "woodstock-client-api", enable = true, start = true },
  { unit-name = "woodstock-worker", enable = true, start = true },
  { unit-name = "woodstock-scheduler", enable = true, start = true },
  { unit-name = "woodstock", unit-scripts = "debian/", enable = true, start = false },
]
assets = [
  # Server binaries
  [
    "target/release/api_server",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/client_api_server",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/job_worker",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/scheduler",
    "usr/bin/",
    "755",
  ],
  # Environment configuration file
  [
    "debian/server.env",
    "etc/woodstock/server.env",
    "640",
  ],
  # Pre-compiled Vue.js frontend (downloaded to server-rs/front-dist/ in CI before cargo-deb)
  [
    "front-dist/**/*",
    "usr/share/woodstock/static/",
    "644",
  ],
]

# Multiple binaries for different server components
[[bin]]
name = "api_server"
path = "src/bin/api_server.rs"

[[bin]]
name = "client_api_server"
path = "src/bin/client_api_server.rs"

[[bin]]
name = "job_worker"
path = "src/bin/job_worker.rs"

[[bin]]
name = "scheduler"
path = "src/bin/scheduler.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }

# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower = { workspace = true, features = ["full"] }
tower-http = { version = "0.7", features = [
  "cors",
  "fs",
  "trace",
  "compression-gzip",
] }

# TLS/HTTPS support
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { workspace = true }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
x509-parser = "0.18"

# Certificate generation
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = { version = "0.3", features = ["macros"] }
base64 = { workspace = true }

# Valkey client (compatible with Redis protocol)
redis = { workspace = true, features = [
  "aio",
  "tokio-comp",
  "connection-manager",
  "safe_iterators",
] }

# Job queue (Apalis)
apalis = { version = "0.7", features = ["limit", "catch-panic", "retry"] }
apalis-redis = "0.7"
apalis-cron = "0.7"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# Validation
validator = { version = "0.21", features = ["derive"] }

# Configuration
config = "0.15.19"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
eyre = { workspace = true }
color-eyre = { workspace = true }
thiserror = "2.0.18"

# HTTP client
reqwest = { workspace = true, default-features = false, features = [
  "json",
  "rustls-no-provider",
] }

# Archive generation
# Tests use sync zip reader (zip), runtime uses async_zip
zip = { version = "^8.2", features = ["deflate"] }
async_zip = { version = "0.0.18", features = ["deflate", "tokio"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
tokio-stream = { workspace = true }
async-stream = { workspace = true }

# GraphQL
async-graphql = { version = "7", default-features = false, features = [
  "chrono",
  "uuid",
  "tracing",
  "apollo_tracing",
  "graphiql",
] }
async-graphql-axum = "7"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

# Direct dependency on woodstock-rs (replaces shared-rs NAPI proxy)
# acl/xattr: dir-mode archiving (archiving::fs_materialize) restores these
# best-effort via woodstock-rs::utils::restore_metadata, same as client-rs.
woodstock-rs = { workspace = true, features = ["acl", "xattr"] }

# OpenAPI/Swagger documentation
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum", "vendored"] }

# Prometheus metrics
prometheus = "0.14"
lru.workspace = true

# Hostname helper
gethostname = "1"

sysinfo = { workspace = true }

[dev-dependencies]
tempfile = "3.26"
